<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" role="img" aria-label="甲乙两人前进路程 s 与时间 t 的关系图象：甲从 0 到 4h 走 20km，乙从 1h 到 2h">
  <title>s-t 图象：甲(0→4h)、乙(1→2h)</title>
  <!-- 甲：(0,0)→(4,20)，速度 5km/h；乙：(1,0)→(2,20)
       坐标轴原点(70,210)，t:40px/h，s:8px/km -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 210 H300"/>
    <path d="M70 210 V30"/>
    <path d="M70 210 L230 50"/>
    <path d="M110 210 L150 50"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M294 205 L300 210 L294 215"/>
    <path d="M65 36 L70 30 L75 36"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 206 V214"/>
    <path d="M150 206 V214"/>
    <path d="M190 206 V214"/>
    <path d="M230 206 V214"/>
    <path d="M66 50 H74"/>
  </g>
  <g fill="currentColor" stroke="none" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
    <text x="300" y="224" text-anchor="start" font-size="13">t</text>
    <text x="60" y="26" text-anchor="end" font-size="13">s</text>
    <text x="70" y="226" text-anchor="middle" font-size="13">O</text>
    <text x="110" y="226" text-anchor="middle" font-size="13">1</text>
    <text x="150" y="226" text-anchor="middle" font-size="13">2</text>
    <text x="190" y="226" text-anchor="middle" font-size="13">3</text>
    <text x="230" y="226" text-anchor="middle" font-size="13">4</text>
    <text x="58" y="54" text-anchor="end" font-size="13">20</text>
    <text x="238" y="42" text-anchor="start" font-size="13">甲</text>
    <text x="156" y="44" text-anchor="start" font-size="13">乙</text>
  </g>
</svg>