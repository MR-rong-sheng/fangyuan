<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 260" role="img" aria-label="四个选项的线条示意图：A 工作中的雨刮器（挡风玻璃上的两根雨刮）、B 移动中的黑板（两块可以左右滑动的黑板）、C 折叠中的纸片（一张纸沿折痕折起一角）、D 骑行中的自行车（人骑着自行车）">
