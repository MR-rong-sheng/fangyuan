<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="O 是平行四边形 ABCD 的对称中心，BC 与 ⊙O 相切于 E">
  <title>平行四边形 ABCD，O 为对称中心，BC 切 ⊙O 于 E</title>
  <!-- 复算：A(62.4,69.6) B(79.2,170.4) C(297.6,170.4) D(280.8,69.6)，O 为 AC 中点(180,120)
       BC 水平 y=170.4，O 到 BC 距离 = 50.4 = 半径，E(180,170.4) 为切点 -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62.4 69.6 L79.2 170.4 L297.6 170.4 L280.8 69.6 Z"/>
    <circle cx="180" cy="120" r="50.4"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 120 V170.4" stroke-dasharray="4 3" stroke-width="1.2"/>
    <path d="M180.0 159.4 L191.0 159.4 L191.0 170.4"/>

  </g>
  <g fill="currentColor" stroke="none" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
    <circle cx="180" cy="120" r="2.2"/>
    <text x="56" y="64" text-anchor="middle" font-size="13">A</text>
    <text x="68" y="190" text-anchor="middle" font-size="13">B</text>
    <text x="304" y="190" text-anchor="middle" font-size="13">C</text>
    <text x="288" y="62" text-anchor="start" font-size="13">D</text>
    <text x="186" y="114" text-anchor="start" font-size="13">O</text>
    <text x="180" y="190" text-anchor="middle" font-size="13">E</text>
  </g>
</svg>