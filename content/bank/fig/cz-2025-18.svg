<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" role="img" aria-label="△ABC 中 tanC=4/3，D 在 BC 上，把 △ACD 沿 AD 翻折得到 △AED，线段 AE 与 BC 相交于点 F，CF=5、EF=2">
  <title>△ACD 沿 AD 翻折得 △AED，AE 与 BC 交于 F</title>
  <!-- 1 单位 = 26px：C(0,0)、A(-6.3,8.4)（AC=10.5，tan∠C=8.4/6.3=4/3）、
       F(-5,0)（CF=5）、E=F+2·(F-A)/|F-A|（EF=2，A、F、E 共线）、
       D 为 CE 垂直平分线与 BC 的交点；实线为翻折后的位置，虚线为翻折前的 AC 与底边 F→C -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96.2 16.6 L26.0 235.0"/>
    <path d="M26.0 235.0 L130.0 235.0"/>
    <path d="M96.2 16.6 L188.2 235.0"/>
    <path d="M96.2 16.6 L138.0 286.4"/>
    <path d="M138.0 286.4 L188.2 235.0"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="6 4">
    <path d="M130.0 235.0 L260.0 235.0"/>
    <path d="M96.2 16.6 L260.0 235.0"/>
  </g>
  <g fill="currentColor" stroke="none" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
    <text x="96.2" y="6.6" text-anchor="middle">A</text>
    <text x="18.0" y="251.0" text-anchor="end">B</text>
    <text x="268.0" y="251.0" text-anchor="start">C</text>
    <text x="126.0" y="254.0" text-anchor="end">F</text>
    <text x="192.2" y="252.0" text-anchor="start">D</text>
    <text x="134.0" y="304.4" text-anchor="end">E</text>
  </g>
</svg>
