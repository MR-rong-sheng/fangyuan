<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" role="img" aria-label="圆锥的三视图：主视图、左视图为三角形，俯视图为圆（含圆心）">
  <title>几何体的三视图（圆锥）：主视图、左视图为三角形，俯视图为带圆心的圆</title>
  <!-- 圆锥：主视图、左视图均为等腰三角形，俯视图为圆 + 圆心 -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 105 L120 105 L85 45 Z"/>
    <path d="M180 105 L250 105 L215 45 Z"/>
    <circle cx="85" cy="190" r="38"/>
  </g>
  <g fill="currentColor" stroke="none" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
    <circle cx="85" cy="190" r="2"/>
    <text x="85" y="125" text-anchor="middle" font-size="13">主视图</text>
    <text x="215" y="125" text-anchor="middle" font-size="13">左视图</text>
    <text x="85" y="245" text-anchor="middle" font-size="13">俯视图</text>
  </g>
</svg>