<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 285" role="img" aria-label="Rt△ABC 中 ∠ACB=90°，AC=6、BC=4，D 是 AC 中点，E 在 BC 上，△CDE 沿 DE 翻折后 C 落在 BD 上的 F 处">
  <title>Rt△ABC 中 △CDE 沿 DE 翻折，C 落在 BD 上的 F 处</title>
  <!-- C(60,240) 直角顶点，A(330,240)，B(60,60)，45px=1 单位；
       D(195,240) 为 AC 中点，E(60,172.5) 使 CE=1.5；F(114,132) 在 BD 上且 DF=DC=3 -->
  <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 240 L60 60"/>
    <path d="M60 60 L60 172.5"/>
    <path d="M60 60 L195 240"/>
    <path d="M195 240 L330 240"/>
    <path d="M195 240 L60 172.5"/>
    <path d="M60 172.5 L114.0 132.0"/>
    <path d="M114.0 132.0 L195 240"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="5 4">
    <path d="M60 172.5 L60 240"/>
    <path d="M60 240 L195 240"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <path d="M72.0 240.0 L72.0 228.0 L60.0 228.0"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.2">
    <path d="M262.5 236.5 L262.5 243.5"/>
    <path d="M127.5 243.5 L127.5 236.5"/>
  </g>
  <g fill="currentColor" stroke="none" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
    <text x="340" y="248" text-anchor="start">A</text>
    <text x="60" y="50" text-anchor="middle">B</text>
    <text x="50" y="252" text-anchor="end">C</text>
    <text x="195" y="260" text-anchor="middle">D</text>
    <text x="48" y="178" text-anchor="end">E</text>
    <text x="110.0" y="122.0" text-anchor="end">F</text>
  </g>
</svg>
